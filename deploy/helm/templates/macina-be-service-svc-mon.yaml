apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  labels:
    app.kubernetes.io/name: {{ .Values.application.name }}-mon
    app.kubernetes.io/instance: {{ .Values.application.name }}
    app.kubernetes.io/version: "1.0.0"
    app.kubernetes.io/component: service
    app.kubernetes.io/part-of: macina-be
    app.kubernetes.io/managed-by: ArgoCD
  name: {{ .Values.application.name }}-mon
  namespace: {{ .Release.Namespace }}
spec:
  endpoints:
    - path: /actuator/prometheus
      port: http-metrics
      scheme: http
  jobLabel: k8s-app
  namespaceSelector:
    matchNames:
      - {{ .Release.Namespace }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ .Values.application.name }}-metrics

---
kind: Service
apiVersion: v1
metadata:
  name: {{ .Release.Name }}-metrics
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: {{ .Release.Name }}-metrics
    app.kubernetes.io/instance: {{ .Values.application.name }}
    app.kubernetes.io/version: "1.0.0"
    app.kubernetes.io/component: service
    app.kubernetes.io/part-of: macina-be
    app.kubernetes.io/managed-by: ArgoCD
spec:
  selector:
    app.kubernetes.io/name: {{ .Release.Name }}
  ports:
    - name: http-metrics
      port: 8181
      protocol: TCP
      targetPort: 8090